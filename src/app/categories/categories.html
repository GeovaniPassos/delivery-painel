<h1>Lista de categorias</h1>

@if (loading()) {
  <p>Carregando...</p>
} @else if (error()) {
  <p>Erro: {{ error() }}</p>
} @else if (categories().length === 0) {
  <p>Nenhuma categoria encontrada.</p>
} @else {
    <ul>
        @for (category of categories(); track category.id) {
        <li>{{ category.name }}</li>
        }
    </ul>
}
